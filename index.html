<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Notes</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <h1>My Notes</h1>

        <!-- Input Form -->
        <div class="input-group">
            <input type="text" id="noteTitle" placeholder="Note Title">
            <input type="text" id="noteContent" placeholder="Note Content">
            <button id="submitBtn" onclick="saveNote(event)">Add Note</button>
        </div>

        <!-- Search Bar -->
        <div style="margin-bottom: 20px;">
            <input type="text" id="searchInput" placeholder="Search notes..." oninput="filterNotes()" style="
          width: 100%;
          padding: 12px 16px;
          background-color: rgba(15, 23, 42, 0.6);
          border: 1px solid rgba(255, 255, 255, 0.1);
          border-radius: 10px;
          font-size: 14px;
          color: #f8fafc;
          outline: none;
        " />
        </div>

        <!-- Notes List -->
        <ul id="notesList"></ul>
    </div>
    <script>
        const API_URL = 'https://my-notes-api-mosy.onrender.com/notes';
        let editNoteId = null;

        // 1. Fetch and Display All Notes
        async function fetchNotes() {
            try {
                const response = await fetch(API_URL);
                const notes = await response.json();

                const notesList = document.getElementById('notesList');
                notesList.innerHTML = '';

                if (notes.length === 0) {
                    notesList.innerHTML = '<p style="text-align: center; color: #64748b; font-size: 14px; padding: 20px 0;">No notes available. Add your first note above!</p>';
                    return;
                }

                notes.forEach(note => {
                    const li = document.createElement('li');

                    // Text container for title and content
                    const textContainer = document.createElement('div');
                    textContainer.style.display = 'flex';
                    textContainer.style.flexDirection = 'column';
                    textContainer.style.gap = '4px';

                    const titleElement = document.createElement('h3');
                    titleElement.textContent = note.title;
                    titleElement.style.fontSize = '16px';
                    titleElement.style.fontWeight = '600';
                    titleElement.style.color = '#f8fafc';
                    titleElement.style.margin = '0';

                    const contentElement = document.createElement('p');
                    contentElement.textContent = note.content;
                    contentElement.style.fontSize = '14px';
                    contentElement.style.color = '#94a3b8';
                    contentElement.style.margin = '0';

                    textContainer.appendChild(titleElement);
                    textContainer.appendChild(contentElement);

                    // Buttons container
                    const actionsContainer = document.createElement('div');
                    actionsContainer.style.display = 'flex';
                    actionsContainer.style.gap = '8px';

                    // Edit button
                    const editBtn = document.createElement('button');
                    editBtn.textContent = 'Edit';
                    editBtn.className = 'edit-btn';
                    editBtn.onclick = () => prepareEditNote(note);

                    // Delete button
                    const deleteBtn = document.createElement('button');
                    deleteBtn.textContent = 'Delete';
                    deleteBtn.className = 'delete-btn';
                    deleteBtn.onclick = () => deleteNote(note.id);

                    actionsContainer.appendChild(editBtn);
                    actionsContainer.appendChild(deleteBtn);

                    li.appendChild(textContainer);
                    li.appendChild(actionsContainer);

                    notesList.appendChild(li);
                });
            } catch (error) {
                console.error('Error fetching notes:', error);
            }
        }

        // 2. Add or Update Note
        async function saveNote(event) {
            event.preventDefault();

            const titleInput = document.getElementById('noteTitle');
            const contentInput = document.getElementById('noteContent');

            const title = titleInput.value.trim();
            const content = contentInput.value.trim();

            if (!title || !content) return;

            try {
                if (editNoteId) {
                    // Update existing note (PUT)
                    await fetch(`${API_URL}/${editNoteId}`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ title, content })
                    });
                    editNoteId = null;
                    document.getElementById('submitBtn').textContent = 'Add Note';
                } else {
                    // Create new note (POST)
                    await fetch(API_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ title, content })
                    });
                }

                titleInput.value = '';
                contentInput.value = '';
                fetchNotes();
            } catch (error) {
                console.error('Error saving note:', error);
            }
        }

        // 3. Prepare Form for Editing
        function prepareEditNote(note) {
            document.getElementById('noteTitle').value = note.title;
            document.getElementById('noteContent').value = note.content;
            document.getElementById('submitBtn').textContent = 'Update Note';
            editNoteId = note.id;
        }

        // 4. Delete Note
        async function deleteNote(id) {
            try {
                await fetch(`${API_URL}/${id}`, {
                    method: 'DELETE'
                });
                fetchNotes();
            } catch (error) {
                console.error('Error deleting note:', error);
            }
        }

        // Initialize
        fetchNotes();
    </script>

</body>

</html>
