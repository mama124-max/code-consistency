<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Note Taking App</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">
        <h1>My Notes</h1>

        <div class="input-group">
            <input type="text" id="titleInput" placeholder="Note Title">
            <input type="text" id="contentInput" placeholder="Note Content">
            <button id="submitBtn" onclick="handleSubmit()">Add Note</button>
        </div>

        <ul id="notesList"></ul>
    </div>

    <script>
        let editingNoteId = null;
        async function fetchNotes() {
            try {
                const response = await fetch('http://localhost:3000/notes');
                const notes = await response.json();

                const notesList = document.getElementById('notesList');
                notesList.innerHTML = '';

                notes.forEach(note => {
                    const li = document.createElement('li');

                    // Text container for title and content
                    const textContainer = document.createElement('div');
                    textContainer.style.display = 'flex';
                    textContainer.style.flexDirection = 'column';
                    textContainer.style.gap = '4px';

                    const titleElement = document.createElement('h3');
                    titleElement.textContent = note.title;
                    titleElement.style.fontSize = '16px';
                    titleElement.style.fontWeight = '600';
                    titleElement.style.color = '#f8fafc';
                    titleElement.style.margin = '0';

                    const contentElement = document.createElement('p');
                    contentElement.textContent = note.content;
                    contentElement.style.fontSize = '14px';
                    contentElement.style.color = '#94a3b8';
                    contentElement.style.margin = '0';

                    textContainer.appendChild(titleElement);
                    textContainer.appendChild(contentElement);

                    // Button group for Edit and Delete
                    const buttonGroup = document.createElement('div');
                    buttonGroup.style.display = 'flex';
                    buttonGroup.style.gap = '6px';

                    const editBtn = document.createElement('button');
                    editBtn.textContent = 'Edit';
                    editBtn.style.backgroundColor = '#f59e0b';
                    editBtn.style.color = '#0f172a';
                    editBtn.style.padding = '8px 14px';
                    editBtn.style.fontSize = '13px';
                    editBtn.onclick = () => startEdit(note);

                    const deleteBtn = document.createElement('button');
                    deleteBtn.textContent = 'Delete';
                    deleteBtn.style.backgroundColor = '#ef4444';
                    deleteBtn.style.color = '#ffffff';
                    deleteBtn.style.padding = '8px 14px';
                    deleteBtn.style.fontSize = '13px';
                    deleteBtn.onclick = () => deleteNote(note.id);

                    buttonGroup.appendChild(editBtn);
                    buttonGroup.appendChild(deleteBtn);

                    // Append text and buttons to list item
                    li.appendChild(textContainer);
                    li.appendChild(buttonGroup);

                    notesList.appendChild(li);
                });
            } catch (error) {
                console.error('Error fetching notes:', error);
            }
        }



        function startEdit(note) {
            document.getElementById('titleInput').value = note.title;
            document.getElementById('contentInput').value = note.content;

            editingNoteId = note.id;
            const submitBtn = document.getElementById('submitBtn');
            submitBtn.textContent = 'Update Note';
            submitBtn.style.backgroundColor = '#f39c12';
        }

        async function handleSubmit() {
            const title = document.getElementById('titleInput').value;
            const content = document.getElementById('contentInput').value;

            if (!title || !content) return;

            if (editingNoteId !== null) {
                // UPDATE existing note (PUT)
                await fetch(`http://localhost:3000/notes/${editingNoteId}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ title, content })
                });

                editingNoteId = null;
                const submitBtn = document.getElementById('submitBtn');
                submitBtn.textContent = 'Add Note';
                submitBtn.style.backgroundColor = '';
            } else {
                // CREATE new note (POST)
                await fetch('http://localhost:3000/notes', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ title, content })
                });
            }

            document.getElementById('titleInput').value = '';
            document.getElementById('contentInput').value = '';

            fetchNotes();
        }

        async function deleteNote(id) {
            await fetch(`http://localhost:3000/notes/${id}`, {
                method: 'DELETE'
            });
            fetchNotes();
        }

        fetchNotes();
    </script>
</body>

</html>
